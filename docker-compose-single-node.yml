# S4 single node + Web Console - Docker Compose Configuration
#
# Builds the Community Edition server from this repository and runs it together
# with the web admin console (s4core/s4console image).
#
# Usage from the repository root:
#   Full stack:      docker compose -f docker-compose-single-node.yml up -d --build
#   Server only:     docker compose -f docker-compose-single-node.yml up -d --build s4core
#   Stop / reset:    docker compose -f docker-compose-single-node.yml down [-v]
#
# After startup:
#   S3 API:          http://localhost:9000
#   Web Console:     http://localhost:3000 (log in as S4_ROOT_USERNAME / S4_ROOT_PASSWORD)
#
# Environment variables read from the shell (defaults in brackets):
#   S4_ROOT_USERNAME - Root admin user name [root]
#   S4_ROOT_PASSWORD - Root admin password; enables IAM, which the console needs to log in [password12345]
#   S4_ACCESS_KEY_ID - S3 access key [my-access-key-one]
#   S4_SECRET_ACCESS_KEY - S3 secret key [my-secret-key-one]

services:
  # ============================================
  # S4 Storage Server
  # ============================================
  s4core:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      - S4_BIND=0.0.0.0:9000
      - S4_DATA_DIR=/data
      - S4_ROOT_USERNAME=${S4_ROOT_USERNAME:-root}
      - S4_ROOT_PASSWORD=${S4_ROOT_PASSWORD:-password12345}
      - S4_ACCESS_KEY_ID=${S4_ACCESS_KEY_ID:-my-access-key-one}
      - S4_SECRET_ACCESS_KEY=${S4_SECRET_ACCESS_KEY:-my-secret-key-one}
      # Unset: a random JWT secret at every start, so console sessions end on restart.
      # To keep them, set a value of at least 32 bytes, generated once: openssl rand -hex 32.
      # Any credential here also has a _FILE form for Docker secrets, e.g.
      # S4_ROOT_PASSWORD_FILE=/run/secrets/s4_pass (remove the plain variable then).
      #- S4_JWT_SECRET=
      #- S4_MAX_UPLOAD_SIZE=5GB
      #- S4_LIFECYCLE_ENABLED=true
      #- S4_LIFECYCLE_INTERVAL_HOURS=24
      #- S4_METRICS_ENABLED=true
      #- RUST_LOG=s4_api=info,s4_server=info
    volumes:
      - s4-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://0.0.0.0:9000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================
  # S4 Web Console (Admin UI)
  # ============================================
  s4console:
    image: s4core/s4console:latest
    ports:
      - "3000:3000"
    environment:
      # The console reaches the server by its compose service name.
      - S4_BACKEND_URL=http://s4core:9000
      - NODE_ENV=production
    depends_on:
      s4core:
        condition: service_healthy
    restart: unless-stopped

volumes:
  s4-data:
    driver: local
