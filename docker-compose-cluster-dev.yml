# S4 Community Edition — 3-node development cluster built from this repository.
#
# Three CE nodes in one replicated pool (RF=3, W=2, R=2) behind HAProxy
# round-robin. Unlike docker-compose-cluster.yml, the image is built from the
# local sources and every node's HTTP port is published as well.
#
# Usage from the repository root:
#   docker compose -f docker-compose-cluster-dev.yml up -d --build
#   docker compose -f docker-compose-cluster-dev.yml down -v   # reset: drops the data volumes
#
# Endpoints: HAProxy http://localhost:9000, HAProxy stats http://localhost:8404,
# nodes http://localhost:9001, :9002, :9003.
#
# Data lives in named volumes: the server runs as the unprivileged user s4
# (uid 1000), and a host directory that Docker creates for a bind mount belongs
# to root, so the node could not write to it.

services:
  haproxy:
    image: haproxy:3.1-alpine
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./haproxy-initial.state:/usr/local/etc/haproxy/initial.state:ro
    ports:
      - "9000:9000"
      - "8404:8404"
    depends_on:
      s4-node1:
        condition: service_healthy
      s4-node2:
        condition: service_healthy
      s4-node3:
        condition: service_healthy

  s4-node1:
    build: .
    ports:
      - "9001:9000"
    environment:
      S4_MODE: cluster
      S4_BIND: "0.0.0.0:9000"
      S4_CLUSTER_NAME: production
      S4_NODE_ID: node-1
      S4_NODE_GRPC_ADDR: s4-node1:9100
      S4_NODE_HTTP_ADDR: s4-node1:9000
      S4_SEEDS: s4-node1:9100,s4-node2:9100,s4-node3:9100
      S4_POOL_NAME: pool-1
      S4_POOL_NODES: "node-1:s4-node1:9100,node-2:s4-node2:9100,node-3:s4-node3:9100"
      S4_DATA_DIR: /data
      S4_MAX_UPLOAD_SIZE: ${S4_MAX_UPLOAD_SIZE:-10GB}
      S4_ACCESS_KEY_ID: ${S4_ACCESS_KEY_ID:-my-access-key-one}
      S4_SECRET_ACCESS_KEY: ${S4_SECRET_ACCESS_KEY:-my-secret-key-one}
      RUST_LOG: ${RUST_LOG:-s4_api=info,s4_server=info,s4_cluster=info}
    volumes:
      - s4-data-1:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 3

  s4-node2:
    build: .
    ports:
      - "9002:9000"
    environment:
      S4_MODE: cluster
      S4_BIND: "0.0.0.0:9000"
      S4_CLUSTER_NAME: production
      S4_NODE_ID: node-2
      S4_NODE_GRPC_ADDR: s4-node2:9100
      S4_NODE_HTTP_ADDR: s4-node2:9000
      S4_SEEDS: s4-node1:9100,s4-node2:9100,s4-node3:9100
      S4_POOL_NAME: pool-1
      S4_POOL_NODES: "node-1:s4-node1:9100,node-2:s4-node2:9100,node-3:s4-node3:9100"
      S4_DATA_DIR: /data
      S4_MAX_UPLOAD_SIZE: ${S4_MAX_UPLOAD_SIZE:-10GB}
      S4_ACCESS_KEY_ID: ${S4_ACCESS_KEY_ID:-my-access-key-one}
      S4_SECRET_ACCESS_KEY: ${S4_SECRET_ACCESS_KEY:-my-secret-key-one}
      RUST_LOG: ${RUST_LOG:-s4_api=info,s4_server=info,s4_cluster=info}
    volumes:
      - s4-data-2:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 3

  s4-node3:
    build: .
    ports:
      - "9003:9000"
    environment:
      S4_MODE: cluster
      S4_BIND: "0.0.0.0:9000"
      S4_CLUSTER_NAME: production
      S4_NODE_ID: node-3
      S4_NODE_GRPC_ADDR: s4-node3:9100
      S4_NODE_HTTP_ADDR: s4-node3:9000
      S4_SEEDS: s4-node1:9100,s4-node2:9100,s4-node3:9100
      S4_POOL_NAME: pool-1
      S4_POOL_NODES: "node-1:s4-node1:9100,node-2:s4-node2:9100,node-3:s4-node3:9100"
      S4_DATA_DIR: /data
      S4_MAX_UPLOAD_SIZE: ${S4_MAX_UPLOAD_SIZE:-10GB}
      S4_ACCESS_KEY_ID: ${S4_ACCESS_KEY_ID:-my-access-key-one}
      S4_SECRET_ACCESS_KEY: ${S4_SECRET_ACCESS_KEY:-my-secret-key-one}
      RUST_LOG: ${RUST_LOG:-s4_api=info,s4_server=info,s4_cluster=info}
    volumes:
      - s4-data-3:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  s4-data-1:
  s4-data-2:
  s4-data-3:
