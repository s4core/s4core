global
    maxconn 8192
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option forwardfor
    timeout http-request 60s
    timeout http-keep-alive 30s
    timeout connect 5s
    timeout client  20m
    timeout server  20m
    timeout client-fin 30s
    timeout server-fin 30s
    retries 3
    retry-on conn-failure

frontend s4_http
    bind *:9000
    default_backend s4_ec_nodes

backend s4_ec_nodes
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server s4-ee-node1 s4-ee-node1:9000 check inter 2s fall 2 rise 1
    server s4-ee-node2 s4-ee-node2:9000 check inter 2s fall 2 rise 1
    server s4-ee-node3 s4-ee-node3:9000 check inter 2s fall 2 rise 1
    server s4-ee-node4 s4-ee-node4:9000 check inter 2s fall 2 rise 1
    server s4-ee-node5 s4-ee-node5:9000 check inter 2s fall 2 rise 1
    server s4-ee-node6 s4-ee-node6:9000 check inter 2s fall 2 rise 1

frontend stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
