syntax = "proto3";
package s4.cluster;

// Inter-node RPC service for S4 distributed storage.
//
// Every node in a server pool runs this service. The coordinator node
// (whichever node received the S3 request) fans out to replica nodes
// via these RPCs.
service S4Node {
    // === Data plane ===

    // Write a blob to a replica node.
    rpc WriteBlob(WriteBlobRequest) returns (WriteBlobResponse);

    // Read a blob from a replica node.
    rpc ReadBlob(ReadBlobRequest) returns (ReadBlobResponse);

    // Delete a blob from a replica node (tombstone).
    rpc DeleteBlob(DeleteBlobRequest) returns (DeleteBlobResponse);

    // Release a replica's local copy of an object while keeping the object in
    // the namespace. Used when data moves to erasure coding: the bytes become
    // shards, but the object must stay listable.
    //
    // Deliberately a separate call rather than a flag on DeleteBlob: a node too
    // old to know about it answers UNIMPLEMENTED, and the purge is simply
    // deferred. A flag on the delete would be ignored by such a node, which
    // would then drop the object out of its listing.
    rpc DetachObjectData(DetachObjectDataRequest) returns (DetachObjectDataResponse);

    // Bring an object's bytes back into a replica's local storage, undoing a
    // DetachObjectData. Used when auto-tiering promotes an object that became
    // hot again: the shards are decoded once by the coordinator and the same
    // bytes are handed to every replica.
    //
    // A node too old to know this call answers UNIMPLEMENTED, and the promotion
    // is left unfinished rather than half applied — the object keeps reading
    // from erasure coding, which is exactly where it still is.
    rpc AttachObjectData(AttachObjectDataRequest) returns (AttachObjectDataResponse);

    // Put back a namespace entry for an erasure-coded object that lost one.
    // Repair only: it never overwrites an entry the replica already has.
    rpc RestoreNamespaceEntry(RestoreNamespaceEntryRequest) returns (RestoreNamespaceEntryResponse);

    // Create a native multipart upload session on a replica.
    rpc CreateMultipartUploadReplica(CreateMultipartUploadReplicaRequest) returns (CreateMultipartUploadReplicaResponse);

    // Store one native multipart part on a replica.
    rpc UploadMultipartPartReplica(stream UploadMultipartPartReplicaChunk) returns (UploadMultipartPartReplicaResponse);

    // Inspect multipart session and part metadata on a replica.
    rpc InspectMultipartUploadReplica(InspectMultipartUploadReplicaRequest) returns (InspectMultipartUploadReplicaResponse);

    // Publish a native multipart manifest on a replica.
    rpc CompleteMultipartUploadReplica(CompleteMultipartUploadReplicaRequest) returns (CompleteMultipartUploadReplicaResponse);

    // Abort a native multipart upload on a replica.
    rpc AbortMultipartUploadReplica(AbortMultipartUploadReplicaRequest) returns (AbortMultipartUploadReplicaResponse);

    // Streaming write for objects > 8MB.
    rpc WriteBlobStream(stream WriteBlobChunk) returns (WriteBlobResponse);

    // Streaming read for objects > 8MB.
    rpc ReadBlobStream(ReadBlobRequest) returns (stream ReadBlobChunk);

    // === Metadata plane ===

    // Write a metadata record to a replica.
    rpc WriteMetadata(WriteMetadataRequest) returns (WriteMetadataResponse);

    // Read a metadata record from a replica.
    rpc ReadMetadata(ReadMetadataRequest) returns (ReadMetadataResponse);

    // Get object HEAD (metadata without data).
    rpc HeadObject(HeadObjectRequest) returns (HeadObjectResponse);

    // List objects on a replica.
    rpc ListObjects(ListObjectsRequest) returns (ListObjectsResponse);

    // Read a node's local record of when an object was last used.
    //
    // Erasure-coding auto-tiering keeps this mark per node, because the node
    // that served a read is the only one that saw it. A node deciding whether
    // an object has gone cold therefore has to ask its peers, and takes the
    // newest answer. A node too old to know the call answers UNIMPLEMENTED,
    // which the caller reads as "no mark here" — the same as a node that has
    // simply never served a read for the object.
    rpc ReadObjectHeat(ReadObjectHeatRequest) returns (ReadObjectHeatResponse);

    // Report this node's local EC manifests as content digests.
    //
    // A node's manifest store holds the objects it transcoded plus the ones its
    // read path resolved, which in a pool wider than the manifest quorum is a
    // fraction of the pool. Two objects with identical content can therefore
    // sit on disjoint nodes, and neither of them sees the repeat. The dedup
    // measurement asks every node of the pool and merges the answers, so the
    // share it reports is the pool's and not one node's slice of it.
    //
    // A node too old to know the call answers UNIMPLEMENTED. That is not "no
    // duplicates here": the caller counts the node as unread and marks the
    // report incomplete.
    rpc ScanEcContentDigests(ScanEcContentDigestsRequest) returns (ScanEcContentDigestsResponse);

    // Ask one node whether it holds each of these deletes.
    //
    // The tombstone sweep has to know, per delete, which owners have seen it
    // before it may release any shards. Asked one delete at a time that is a
    // round trip per delete per owner; asked in a batch it is one per owner, and
    // the answer is the same.
    //
    // A node too old to know the call answers UNIMPLEMENTED, and the caller
    // falls back to asking about each delete on its own — which is the same
    // question at the old price, not a weaker gate.
    rpc ProbeEcTombstones(ProbeEcTombstonesRequest) returns (ProbeEcTombstonesResponse);

    // === Repair / Anti-entropy ===

    // Exchange Merkle tree digests for divergence detection.
    rpc ExchangeMerkleDigest(MerkleDigestRequest) returns (MerkleDigestResponse);

    // Request specific keys for repair synchronization.
    rpc RepairSync(RepairSyncRequest) returns (stream RepairSyncResponse);

    // === Cluster management ===

    // Health check for liveness and readiness probes.
    rpc Health(HealthRequest) returns (HealthResponse);

    // Stream a full snapshot for bootstrapping a new/replaced node.
    rpc StreamSnapshot(SnapshotRequest) returns (stream SnapshotChunk);

    // === Hinted handoff ===

    // Deliver a hinted write to a node that has come back online.
    rpc DeliverHint(HintRequest) returns (HintResponse);
}

// ============================================================================
// Common types
// ============================================================================

// Hybrid Logical Clock timestamp for causal ordering (MVP: LWW).
// See ADR-F4-REVISED: DVV is deferred to post-MVP.
message HybridTimestamp {
    // Physical wall clock time in milliseconds since Unix epoch.
    uint64 wall_time = 1;
    // Logical counter for events within the same millisecond.
    uint32 logical = 2;
    // Node ID (16 bytes, UUID v4) used as tiebreaker.
    bytes node_id = 3;
}

// Reserved for post-MVP (ADR-F4-REVISED).
// Dotted Version Vector for full causal context tracking.
message DottedVersionVector {
    // (replica_slot -> max_seen_counter) per replica.
    map<uint32, uint64> entries = 1;
    // The "dot" — the event that produced this version.
    uint32 dot_slot = 2;
    uint64 dot_counter = 3;
}

// ============================================================================
// Data plane messages
// ============================================================================

message WriteBlobRequest {
    string bucket = 1;
    string key = 2;
    bytes data = 3;
    bytes content_hash = 4;         // SHA-256 of the data
    string content_type = 5;
    map<string, string> metadata = 6;
    HybridTimestamp hlc = 7;
    optional string version_id = 9;
    bytes coordinator_id = 10;      // NodeId (16 bytes UUID)
    bytes operation_id = 11;        // OperationId (16 bytes UUID)
    uint64 topology_epoch = 12;     // Coordinator's current epoch
}

message WriteBlobResponse {
    bool success = 1;
    string error = 2;
    uint64 local_sequence = 3;      // Sequence in the local journal
    bool epoch_mismatch = 4;        // true if replica has a different epoch
}

message ReadBlobRequest {
    string bucket = 1;
    string key = 2;
    optional string version_id = 3;
    bytes coordinator_id = 4;       // NodeId (16 bytes UUID)
    bytes operation_id = 5;         // OperationId (16 bytes UUID)
    uint64 topology_epoch = 6;
    optional uint64 range_start = 7;
    optional uint64 range_end = 8;
}

message ReadBlobResponse {
    bool success = 1;
    string error = 2;
    bytes data = 3;
    bytes content_hash = 4;         // SHA-256
    string content_type = 5;
    map<string, string> metadata = 6;
    HybridTimestamp hlc = 7;
    optional string version_id = 8;
    uint64 content_length = 9;
    bool epoch_mismatch = 10;
}

message DeleteBlobRequest {
    string bucket = 1;
    string key = 2;
    HybridTimestamp hlc = 3;
    bytes coordinator_id = 4;       // NodeId (16 bytes UUID)
    bytes operation_id = 5;         // OperationId (16 bytes UUID)
    uint64 topology_epoch = 6;
    optional string version_id = 7;
    HybridTimestamp expected_source_hlc = 8; // Optional generation guard for physical GC purges
}

message DeleteBlobResponse {
    bool success = 1;
    string error = 2;
    uint64 local_sequence = 3;
    bool epoch_mismatch = 4;
}

message DetachObjectDataRequest {
    string bucket = 1;
    string key = 2;
    bytes coordinator_id = 3;                // NodeId (16 bytes UUID)
    bytes operation_id = 4;                  // OperationId (16 bytes UUID)
    uint64 topology_epoch = 5;
    HybridTimestamp expected_source_hlc = 6; // Generation guard, always required
    uint64 erasure_set_id = 7;               // Set that owns the shards
    uint64 ec_topology_epoch = 8;            // Topology the object was placed under
}

message AttachObjectDataRequest {
    string bucket = 1;
    string key = 2;
    bytes coordinator_id = 3;                // NodeId (16 bytes UUID)
    bytes operation_id = 4;                  // OperationId (16 bytes UUID)
    uint64 topology_epoch = 5;
    HybridTimestamp expected_source_hlc = 6; // Generation guard, always required
    bytes data = 7;                          // Full object bytes, decoded from the shards
}

message AttachObjectDataResponse {
    bool success = 1;
    string error = 2;
    // False when no record matched the expected generation. Not an error: the
    // object was overwritten while the promotion was in flight.
    bool attached = 3;
    bool epoch_mismatch = 4;
}

message RestoreNamespaceEntryRequest {
    string bucket = 1;
    string key = 2;
    // Serialized IndexRecord rebuilt from the EC manifest. The replica refuses
    // it unless it carries an erasure-coded layout.
    bytes record = 3;
    bytes coordinator_id = 4;
    bytes operation_id = 5;
    uint64 topology_epoch = 6;
}

message RestoreNamespaceEntryResponse {
    bool success = 1;
    string error = 2;
    // False when the replica already had an entry, which always wins.
    bool restored = 3;
    bool epoch_mismatch = 4;
}

message DetachObjectDataResponse {
    bool success = 1;
    string error = 2;
    // False when no record matched the expected generation. Not an error: the
    // object was overwritten while the migration was in flight.
    bool detached = 3;
    bool epoch_mismatch = 4;
}

message CreateMultipartUploadReplicaRequest {
    string upload_id = 1;
    string bucket = 2;
    string key = 3;
    string content_type = 4;
    map<string, string> metadata = 5;
    bytes coordinator_id = 6;
    bytes operation_id = 7;
    uint64 topology_epoch = 8;
}

message CreateMultipartUploadReplicaResponse {
    bool success = 1;
    string error = 2;
    bool epoch_mismatch = 3;
}

message UploadMultipartPartReplicaHeader {
    string upload_id = 1;
    uint32 part_number = 2;
    bytes coordinator_id = 3;
    bytes operation_id = 4;
    uint64 topology_epoch = 5;
    uint64 total_size = 6;
}

message UploadMultipartPartReplicaChunk {
    oneof payload {
        UploadMultipartPartReplicaHeader header = 1;
        bytes data = 2;
    }
}

message UploadMultipartPartReplicaResponse {
    bool success = 1;
    string error = 2;
    string etag = 3;
    bytes part_record = 4;         // bincode MultipartPartRecord
    bool epoch_mismatch = 5;
}

message InspectMultipartUploadReplicaRequest {
    string bucket = 1;
    string key = 2;
    string upload_id = 3;
    bytes coordinator_id = 4;
    bytes operation_id = 5;
    uint64 topology_epoch = 6;
}

message InspectMultipartUploadReplicaResponse {
    bool success = 1;
    string error = 2;
    bytes session = 3;             // bincode MultipartUploadSession
    repeated bytes part_records = 4; // bincode MultipartPartRecord
    bool epoch_mismatch = 5;
}

message CompleteMultipartUploadReplicaRequest {
    string bucket = 1;
    string key = 2;
    string upload_id = 3;
    repeated bytes selected_part_records = 4; // bincode MultipartPartRecord
    string s3_etag = 5;
    string content_type = 6;
    map<string, string> metadata = 7;
    HybridTimestamp hlc = 8;
    bytes coordinator_id = 9;
    bytes operation_id = 10;
    uint64 topology_epoch = 11;
}

message CompleteMultipartUploadReplicaResponse {
    bool success = 1;
    string error = 2;
    bytes index_record = 3;        // bincode IndexRecord
    bool epoch_mismatch = 4;
}

message AbortMultipartUploadReplicaRequest {
    string upload_id = 1;
    bytes coordinator_id = 2;
    bytes operation_id = 3;
    uint64 topology_epoch = 4;
}

message AbortMultipartUploadReplicaResponse {
    bool success = 1;
    string error = 2;
    bool epoch_mismatch = 3;
}

// ============================================================================
// Streaming messages (for objects > 8MB)
// ============================================================================

message WriteBlobChunk {
    oneof payload {
        WriteBlobHeader header = 1;  // First chunk: metadata
        bytes data = 2;              // Subsequent chunks: raw data
    }
}

message WriteBlobHeader {
    string bucket = 1;
    string key = 2;
    bytes content_hash = 3;         // SHA-256 of the complete object
    string content_type = 4;
    map<string, string> metadata = 5;
    HybridTimestamp hlc = 6;
    optional string version_id = 7;
    bytes coordinator_id = 8;
    bytes operation_id = 9;
    uint64 topology_epoch = 10;
    uint64 total_size = 11;         // Total data size in bytes
}

message ReadBlobChunk {
    oneof payload {
        ReadBlobHeader header = 1;   // First chunk: metadata
        bytes data = 2;              // Subsequent chunks: raw data
    }
}

message ReadBlobHeader {
    bytes content_hash = 1;
    string content_type = 2;
    map<string, string> metadata = 3;
    HybridTimestamp hlc = 4;
    optional string version_id = 5;
    uint64 content_length = 6;
    uint64 total_size = 7;
    optional uint64 range_start = 8;
    optional uint64 range_end = 9;
}

// ============================================================================
// Metadata plane messages
// ============================================================================

message WriteMetadataRequest {
    string bucket = 1;
    string key = 2;
    bytes record = 3;               // Serialized IndexRecord
    HybridTimestamp hlc = 4;
    bytes coordinator_id = 5;
    bytes operation_id = 6;
    uint64 topology_epoch = 7;
    optional string version_id = 8;
}

message WriteMetadataResponse {
    bool success = 1;
    string error = 2;
    uint64 local_sequence = 3;
    bool epoch_mismatch = 4;
}

message ReadMetadataRequest {
    string bucket = 1;
    string key = 2;
    optional string version_id = 3;
    bytes coordinator_id = 4;
    bytes operation_id = 5;
    uint64 topology_epoch = 6;
}

message ReadMetadataResponse {
    bool success = 1;
    string error = 2;
    bytes record = 3;               // Serialized IndexRecord
    HybridTimestamp hlc = 4;
    optional string version_id = 5;
    bool epoch_mismatch = 6;
}

message HeadObjectRequest {
    string bucket = 1;
    string key = 2;
    optional string version_id = 3;
    uint64 topology_epoch = 4;
}

message HeadObjectResponse {
    bool exists = 1;
    string error = 2;
    string content_type = 3;
    uint64 content_length = 4;
    map<string, string> metadata = 5;
    HybridTimestamp hlc = 6;
    optional string version_id = 7;
    string etag = 8;
    bool epoch_mismatch = 9;
    // The record describes an object whose bytes are erasure-coded shards, not
    // a locally stored copy. Readers must not treat it as a hot replica.
    bool erasure_coded = 10;
    // SHA-256 of the object content, 32 bytes. Empty from a node too old to
    // send it, which callers must read as "unknown", never as a mismatch.
    bytes content_hash = 11;
}

message ListObjectsRequest {
    string bucket = 1;
    string prefix = 2;
    string delimiter = 3;
    uint32 max_keys = 4;
    string continuation_token = 5;
    uint64 topology_epoch = 6;
}

message ListObjectsResponse {
    repeated ObjectInfo objects = 1;
    repeated string common_prefixes = 2;
    bool is_truncated = 3;
    string next_continuation_token = 4;
    string error = 5;
    bool epoch_mismatch = 6;
}

message ReadObjectHeatRequest {
    string bucket = 1;
    string key = 2;
    // Empty when the mark is about the current version, which is the only
    // version auto-tiering migrates.
    string version_id = 3;
    bytes coordinator_id = 4;
    // Width of the trailing window the caller wants the read count over. Zero
    // means "whatever this node is configured for", which is what a caller
    // from before bucket-level promotion windows sends.
    uint64 window_nanos = 5;
}

message ReadObjectHeatResponse {
    bool success = 1;
    string error = 2;
    // False when this node has never recorded an access for the object.
    bool found = 3;
    uint64 last_access_nanos = 4;
    // Field 5 carried the start of a tumbling window. Reverse tiering counts
    // reads over a sliding one, which has no single start, so the responder
    // now evaluates the count itself and the caller only sums what it is told.
    reserved 5;
    // Reads this node served within the trailing window, as of its own clock.
    uint32 window_access_count = 6;
}

message ScanEcContentDigestsRequest {
    // Upper bound on manifests this node may walk. The responder clamps it to
    // its own S4_EC_ADMIN_SCAN_LIMIT.
    uint32 max_entries = 1;
    bytes coordinator_id = 2;
}

message ScanEcContentDigestsResponse {
    bool success = 1;
    string error = 2;
    repeated EcContentDigest digests = 3;
    // Manifests read, including the ones filtered out of `digests` because they
    // describe no stored EC bytes.
    uint32 scanned = 4;
    // True when the walk stopped at the limit rather than at the end of the
    // store, so this node's contribution is a prefix and not its whole share.
    bool truncated = 5;
}

message ProbeEcTombstonesRequest {
    bytes coordinator_id = 1;
    uint64 topology_epoch = 2;
    repeated EcTombstoneProbe probes = 3;
}

message ProbeEcTombstonesResponse {
    bool success = 1;
    string error = 2;
    // One answer per probe, in the order they were asked. A responder that
    // cannot answer one of them says `false` for it: "not shown to hold this
    // delete" is exactly what the gate asks, and it is the safe answer.
    repeated bool held = 3;
}

// One delete, identified the way the sweep identifies it: same object, same
// delete operation, same HLC. A tombstone carries no shards to check, so the
// probe carries no placement either.
message EcTombstoneProbe {
    string bucket = 1;
    string key = 2;
    // Empty when the delete is of an unversioned object.
    string version_id = 3;
    bytes operation_id = 4;
    uint64 hlc_wall_time = 5;
    uint32 hlc_logical = 6;
    bytes hlc_node_id = 7;
}

// One live EC object as the dedup measurement sees it.
//
// The object reference travels with the digest so the report can name examples
// and tell apart a repeat across versions from one across buckets — the two
// lead to different conclusions in the gap analysis.
message EcContentDigest {
    string bucket = 1;
    string key = 2;
    // Empty when the manifest describes an unversioned object.
    string version_id = 3;
    bytes content_hash_sha256 = 4;
    uint64 original_size = 5;
    // Dedup cannot cross a set boundary, so a repeat that spans two sets is not
    // a saving. The merge keeps them apart by this field.
    uint64 erasure_set_id = 6;
    // True when the object's bytes live inside a packed segment. Those bytes
    // are already shared with other objects' bytes in one encoded segment, so
    // shard-level dedup has nothing to save on them.
    bool packed = 7;
}

message ObjectInfo {
    string key = 1;
    uint64 size = 2;
    string content_type = 3;
    string etag = 4;
    HybridTimestamp hlc = 5;
    optional string version_id = 6;
}

// ============================================================================
// Repair / Anti-entropy messages
// ============================================================================

message MerkleDigestRequest {
    string bucket = 1;
    bytes range_start = 2;          // Key range start (inclusive)
    bytes range_end = 3;            // Key range end (exclusive)
    uint32 level = 4;               // Tree level (0 = leaf)
    bytes tree_hash = 5;            // SHA-256 hash at this level
    uint64 topology_epoch = 6;
}

message MerkleDigestResponse {
    bool match = 1;
    repeated MerkleRange divergent_ranges = 2;
    bytes tree_hash = 3;
    bool epoch_mismatch = 4;
}

message MerkleRange {
    bytes range_start = 1;
    bytes range_end = 2;
    bytes local_hash = 3;
}

message RepairSyncRequest {
    string bucket = 1;
    repeated string keys = 2;       // Keys to synchronize
    uint64 topology_epoch = 3;
}

message RepairSyncResponse {
    string key = 1;
    bytes data = 2;
    bytes record = 3;               // Serialized IndexRecord
    HybridTimestamp hlc = 4;
    optional string version_id = 5;
    bytes content_hash = 6;
    string content_type = 7;
    map<string, string> metadata = 8;
}

// ============================================================================
// Cluster management messages
// ============================================================================

message HealthRequest {
    // Empty — no parameters needed for basic health check.
}

message HealthResponse {
    NodeHealthStatus status = 1;
    bytes node_id = 2;              // 16 bytes UUID
    string node_name = 3;
    uint32 pool_id = 4;
    uint64 uptime_seconds = 5;
    uint64 topology_epoch = 6;
    uint32 protocol_version = 7;
    string s4_version = 8;
    NodeCapacityInfo capacity = 9;
    uint32 known_members = 10;
    uint32 alive_members = 11;
}

enum NodeHealthStatus {
    NODE_HEALTH_STATUS_UNKNOWN = 0;
    NODE_HEALTH_STATUS_HEALTHY = 1;
    NODE_HEALTH_STATUS_DEGRADED = 2;
    NODE_HEALTH_STATUS_UNHEALTHY = 3;
}

message NodeCapacityInfo {
    uint64 total_bytes = 1;
    uint64 used_bytes = 2;
    uint32 volume_count = 3;
    uint64 object_count = 4;
}

// ============================================================================
// Snapshot streaming messages
// ============================================================================

message SnapshotRequest {
    string bucket = 1;              // Empty = full snapshot
    uint64 from_sequence = 2;       // 0 = from the beginning
    uint64 topology_epoch = 3;
}

message SnapshotChunk {
    uint64 sequence = 1;
    bytes data = 2;                 // Serialized key-value pairs
    bool is_last = 3;
    uint64 total_keys = 4;         // Estimated total (set in first chunk)
    uint64 keys_sent = 5;          // Progress counter
}

// ============================================================================
// Hinted handoff messages
// ============================================================================

message HintRequest {
    bytes target_node_id = 1;       // Original intended recipient
    string bucket = 2;
    string key = 3;
    bytes data = 4;
    bytes content_hash = 5;
    HybridTimestamp hlc = 6;
    bytes operation_id = 7;
    optional string version_id = 8;
    map<string, string> metadata = 9;
    string content_type = 10;
    HybridTimestamp expected_source_hlc = 11;
}

message HintResponse {
    bool accepted = 1;
    string error = 2;
}
